name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compatible MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify offline, independent oracle, Linux and archive consumer
        run: |
          mkdir -p release-local
          python scripts/verify.py
          python scripts/verify_oracle.py
          python scripts/verify_linux.py
          python scripts/verify_package.py
      - name: Verify real overmount and remount in a private mount namespace
        run: sudo unshare --mount --propagation private env "PATH=$PATH" MOONMOUNT_DISPOSABLE_NAMESPACE=1 python scripts/verify_mount_namespace.py
